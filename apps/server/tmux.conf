# tmux di AgiCloud: invisibile. Serve solo a far sopravvivere i terminali ai riavvii del server.
set -g status off
# Nessun tasto prefisso: Ctrl+B e gli altri tasti arrivano intatti ai programmi
set -g prefix None
unbind C-b
set -g escape-time 10
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
# La finestra segue le misure del browser collegato per ultimo
set -g window-size latest
# Chiusura del programma = fine della sessione (niente schermate "Pane is dead")
set -g remain-on-exit off
set -g mouse off
